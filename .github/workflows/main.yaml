name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # needed for pushing to GHCR

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v3

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Docker (required for testcontainers)
        run: |
          docker version
          docker ps

      - name: Run pytest
        run: pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        run: docker build --target production -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Emit event to homelab
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.HOMELAB_TOKEN }}
          repository: abellucci93/homelab
          event-type: blog-claps-image-pushed
          client-payload: '{"image_tag": "${{ github.sha }}"}'
